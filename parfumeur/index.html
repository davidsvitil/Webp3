<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parfumeur · Niche parfémy, showroom Praha</title>
  <meta name="description" content="Koncept nového e-shopu Parfumeur – niche parfémy Xerjoff, Fragonard, Galimard, Almah, showroom Praha 1.">
  <meta name="theme-color" content="#141210">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="concept">
  <!-- Concept notice: this is an unofficial design proposal, not the live shop -->
  <div class="concept-bar" role="note">
    <b>KONCEPT</b> Nejde o oficiální web Parfemy-parfumeur.cz<span class="concept-more"> – nezávislý návrh, objednávky nejsou závazné.</span>
    <a href="https://www.parfemy-parfumeur.cz" target="_blank" rel="noopener">Oficiální e-shop ›</a>
  </div>
  <div class="watermark" aria-hidden="true"></div>
  <a class="skip" href="#main">Přeskočit na obsah</a>

  <!-- Floating pill navigation -->
  <header class="pill" id="pill">
    <div class="pill-bar">
      <a href="#/" class="pill-logo" aria-label="Parfumeur – domů">
        <img src="assets/img/logo.svg" alt="Parfumeur" width="140" height="26">
      </a>
      <div class="pill-actions">
        <button class="pill-btn dark" id="menuBtn" aria-expanded="false" aria-controls="pillMenu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
        </button>
        <span class="pill-sep" aria-hidden="true"></span>
        <button class="pill-btn light" id="cartBtn" aria-label="Košík">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
    <nav class="pill-menu" id="pillMenu" aria-label="Menu"></nav>
  </header>

  <main id="main" class="frame" tabindex="-1"></main>

  <!-- Cart drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Košík" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Košík</h2>
      <button class="round" id="drawerClose" aria-label="Zavřít">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
